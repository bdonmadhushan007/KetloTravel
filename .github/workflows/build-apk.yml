<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KETLO TRAVEL | 3D Sri Lanka Tourism & Admin Portal</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Cinzel / Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Cinzel"', 'serif'],
          },
          colors: {
            studio: {
              50: '#f8fafc',
              100: '#eef2f7',
              200: '#e2e8f0',
              850: '#13192b',
              950: '#0a0e1a',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* ================= PROFESSIONAL 3D STUDIO SKIN ================= */
    :root {
      --iridescent-grad: linear-gradient(135deg, #fbbf24 0%, #f43f5e 34%, #8b5cf6 68%, #0284c7 100%);
      --silver-grad: linear-gradient(180deg, #ffffff 0%, #e2e8f0 55%, #94a3b8 100%);
      --surface-3d: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      --shadow-3d-sm: 
        0 6px 14px -3px rgba(15, 23, 42, 0.12),
        0 2px 6px -1px rgba(15, 23, 42, 0.06),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.95),
        inset 0 -2px 3px rgba(148, 163, 184, 0.25);
      --shadow-3d-lg: 
        0 22px 42px -12px rgba(15, 23, 42, 0.18),
        0 8px 18px -6px rgba(15, 23, 42, 0.08),
        inset 0 2px 2px rgba(255, 255, 255, 0.98),
        inset 0 -3px 6px rgba(148, 163, 184, 0.28);
      --shadow-3d-dark:
        0 24px 48px -12px rgba(2, 6, 23, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.18),
        inset 0 -3px 6px rgba(0, 0, 0, 0.55);
    }

    body {
      background-color: #eef2f7;
      background-image: 
        radial-gradient(at 15% 10%, rgba(244, 63, 94, 0.07) 0px, transparent 45%),
        radial-gradient(at 85% 15%, rgba(139, 92, 246, 0.08) 0px, transparent 45%),
        radial-gradient(at 50% 85%, rgba(2, 132, 199, 0.07) 0px, transparent 50%);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* 3D Extruded Squircle Card (Inspired by 49465.jpg Badge) */
    .card-3d {
      background: var(--surface-3d);
      border-radius: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-3d-lg);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .card-3d-hover:hover {
      transform: translateY(-7px) perspective(1000px) rotateX(1.5deg);
      box-shadow: 
        0 30px 55px -14px rgba(15, 23, 42, 0.24),
        0 12px 24px -8px rgba(139, 92, 246, 0.14),
        inset 0 2px 2px rgba(255, 255, 255, 1),
        inset 0 -3px 6px rgba(148, 163, 184, 0.3);
    }

    .squircle-3d-logo {
      border-radius: 24%;
      background: linear-gradient(145deg, #ffffff 0%, #e2e8f0 100%);
      box-shadow: 
        0 10px 22px -5px rgba(15, 23, 42, 0.25),
        0 4px 8px -2px rgba(139, 92, 246, 0.2),
        inset 0 2px 2px rgba(255, 255, 255, 1),
        inset 0 -2px 4px rgba(100, 116, 139, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    /* Tactile 3D Beveled Buttons */
    .btn-3d-iridescent {
      background: var(--iridescent-grad);
      color: #ffffff;
      box-shadow: 
        0 10px 20px -5px rgba(139, 92, 246, 0.45),
        0 4px 0 #4c1d95,
        inset 0 1.5px 1px rgba(255, 255, 255, 0.55);
      transition: all 0.18s ease;
    }
    .btn-3d-iridescent:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
      box-shadow: 
        0 14px 26px -5px rgba(244, 63, 94, 0.5),
        0 6px 0 #4c1d95,
        inset 0 1.5px 1px rgba(255, 255, 255, 0.65);
    }
    .btn-3d-iridescent:active {
      transform: translateY(3px);
      box-shadow: 
        0 4px 10px -2px rgba(139, 92, 246, 0.4),
        0 1px 0 #4c1d95,
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .btn-3d-silver {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      color: #0f172a;
      border: 1px solid #ffffff;
      box-shadow: 
        0 8px 16px -4px rgba(15, 23, 42, 0.14),
        0 4px 0 #94a3b8,
        inset 0 1.5px 1px #ffffff;
      transition: all 0.18s ease;
    }
    .btn-3d-silver:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 12px 22px -4px rgba(15, 23, 42, 0.18),
        0 6px 0 #94a3b8,
        inset 0 1.5px 1px #ffffff;
    }
    .btn-3d-silver:active {
      transform: translateY(3px);
      box-shadow: 
        0 3px 8px -2px rgba(15, 23, 42, 0.15),
        0 1px 0 #94a3b8;
    }

    .btn-3d-dark {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        0 10px 20px -5px rgba(2, 6, 23, 0.45),
        0 4px 0 #020617,
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.18s ease;
    }
    .btn-3d-dark:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 14px 24px -5px rgba(2, 6, 23, 0.55),
        0 6px 0 #020617,
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }
    .btn-3d-dark:active {
      transform: translateY(3px);
      box-shadow: 0 2px 6px rgba(2, 6, 23, 0.5), 0 1px 0 #020617;
    }

    /* Metallic Brushed Silver Text & Iridescent Text */
    .text-metallic-silver {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 48%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.45));
    }

    .text-iridescent {
      background: var(--iridescent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 3D Recessed Input Field */
    .input-3d {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.08), 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: all 0.2s ease;
    }
    .input-3d:focus {
      background: #ffffff;
      border-color: #8b5cf6;
      box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.04), 0 0 0 3px rgba(139, 92, 246, 0.2);
      outline: none;
    }

    /* 3D Hero Stage */
    .hero-3d-stage {
      background: 
        radial-gradient(circle at 80% 25%, rgba(244, 63, 94, 0.28), transparent 45%),
        radial-gradient(circle at 20% 75%, rgba(2, 132, 199, 0.32), transparent 50%),
        linear-gradient(135deg, rgba(10, 14, 26, 0.88) 0%, rgba(19, 25, 43, 0.84) 100%),
        url('https://images.unsplash.com/photo-1586613835341-78c143aef52c?auto=format&fit=crop&w=1920&q=85');
      background-size: cover;
      background-position: center;
    }

    /* Floating 3D Logo Levitation */
    @keyframes float-3d {
      0%, 100% { transform: translateY(0px) rotateY(-4deg) rotateX(3deg); }
      50% { transform: translateY(-10px) rotateY(4deg) rotateX(-2deg); }
    }
    .logo-float-3d {
      animation: float-3d 5.5s ease-in-out infinite;
      transform-style: preserve-3d;
    }

    /* Glassmorphic 3D Navbar */
    .glass-nav-3d {
      background: rgba(248, 250, 252, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 
        0 10px 30px -10px rgba(15, 23, 42, 0.12),
        inset 0 -1px 0 rgba(255, 255, 255, 0.9);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.88); opacity: 0.75; }
      70% { transform: scale(1.28); opacity: 0; }
      100% { transform: scale(1.28); opacity: 0; }
    }
    .chat-pulse::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: var(--iridescent-grad);
      animation: pulse-ring 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      z-index: -1;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-purple-600 selection:text-white">

  <!-- Toast Notification Banner -->
  <div id="toast-container" class="fixed top-24 right-4 z-[100] flex flex-col gap-2.5 pointer-events-none"></div>

  <!-- ================= 3D GLASSMORPHIC NAVIGATION HEADER ================= -->
  <header class="sticky top-0 z-40 glass-nav-3d border-b border-white/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <!-- Brand 3D Squircle Logo & Metallic Typography -->
        <a href="#" onclick="switchView('public')" class="flex items-center gap-3.5 group focus:outline-none">
          <div id="header-logo-container" class="w-13 h-13 w-12 h-12 sm:w-14 sm:h-14 squircle-3d-logo overflow-hidden flex items-center justify-center p-0.5 group-hover:scale-105 transition-transform">
            <!-- Populated with 49465.jpg -->
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-display font-extrabold text-xl sm:text-2xl tracking-wider text-slate-900">KETLO</span>
              <span class="font-sans font-extrabold text-[10px] sm:text-xs tracking-widest uppercase px-2.5 py-0.5 rounded-lg text-white shadow-sm" style="background: var(--iridescent-grad);">TRAVEL</span>
            </div>
            <p class="text-[11px] text-slate-500 font-semibold hidden sm:block">3D Sri Lanka Luxury Tours & Safaris</p>
          </div>
        </a>

        <!-- Desktop Navigation Links -->
        <nav id="public-nav-links" class="hidden lg:flex items-center gap-7 text-sm font-bold text-slate-600">
          <a href="#destinations" onclick="switchView('public')" class="hover:text-purple-700 transition-colors">Destinations</a>
          <a href="#experiences" onclick="switchView('public')" class="hover:text-purple-700 transition-colors">3D Experience</a>
          <a href="#contact-footer" onclick="switchView('public')" class="hover:text-purple-700 transition-colors">Contact</a>
          <a href="mailto:ketlotravel@gmail.com" class="flex items-center gap-1.5 text-slate-700 bg-white px-3.5 py-1.5 rounded-full border border-slate-200/90 shadow-sm hover:border-purple-400 transition-all text-xs">
            <i data-lucide="mail" class="w-3.5 h-3.5 text-rose-500"></i>
            <span id="nav-email-display">ketlotravel@gmail.com</span>
          </a>
        </nav>

        <!-- 3D Tactile Action Buttons -->
        <div class="flex items-center gap-3">
          <button onclick="openBookingModal()" class="hidden sm:inline-flex items-center gap-2 btn-3d-iridescent text-xs sm:text-sm font-bold px-4 sm:px-5 py-2.5 rounded-2xl">
            <i data-lucide="calendar-check" class="w-4 h-4"></i>
            <span>Book Tour</span>
          </button>

          <button id="admin-nav-btn" onclick="handleAdminNavClick()" class="inline-flex items-center gap-2 btn-3d-dark text-xs sm:text-sm font-bold px-4 py-2.5 rounded-2xl">
            <i data-lucide="shield-check" class="w-4 h-4 text-amber-400"></i>
            <span id="admin-nav-label">Admin Login</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= PUBLIC TOURIST VIEW ================= -->
  <main id="public-view" class="block">
    
    <!-- 3D Hero Stage -->
    <section class="hero-3d-stage relative text-white py-16 sm:py-24 lg:py-28 px-4 sm:px-6 lg:px-8 overflow-hidden border-b border-white/10">
      <div class="max-w-7xl mx-auto relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-8 items-center">
          
          <!-- Left Hero Typography -->
          <div class="lg:col-span-7">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-amber-300 text-xs sm:text-sm font-bold mb-6 shadow-lg">
              <i data-lucide="sparkles" class="w-4 h-4 text-rose-400"></i>
              <span>Official Sri Lanka Destination Specialist • ketlotravel@gmail.com</span>
            </div>
            
            <h1 class="font-display text-4xl sm:text-5xl lg:text-6xl font-extrabold leading-tight mb-5">
              <span class="text-metallic-silver">DISCOVER SRI LANKA</span><br/>
              <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-rose-400 to-sky-400 italic font-sans font-extrabold text-3xl sm:text-4xl lg:text-5xl">In Next-Gen Luxury</span>
            </h1>
            
            <p class="text-slate-200 text-base sm:text-lg leading-relaxed mb-8 max-w-2xl">
              Experience the Pearl of the Indian Ocean with <strong>KETLO TRAVEL</strong>. From ancient Sigiriya rock fortresses and misty Ella tea estates to Yala leopard safaris and golden Mirissa beaches — book your private tour online in seconds.
            </p>

            <div class="flex flex-wrap items-center gap-4">
              <button onclick="openBookingModal()" class="inline-flex items-center gap-2.5 btn-3d-iridescent font-extrabold px-7 py-4 rounded-2xl text-sm sm:text-base">
                <i data-lucide="compass" class="w-5 h-5"></i>
                <span>Book Your Sri Lanka Tour</span>
              </button>
              <a href="#destinations" class="inline-flex items-center gap-2 btn-3d-silver font-bold px-6 py-4 rounded-2xl text-sm sm:text-base">
                <span>Explore Locations</span>
                <i data-lucide="arrow-down" class="w-4 h-4 text-purple-700"></i>
              </a>
            </div>
          </div>

          <!-- Right 3D Floating Squircle Emblem Showcase (Featuring 49465.jpg) -->
          <div class="lg:col-span-5 flex justify-center">
            <div class="relative p-6 sm:p-8 rounded-[2.5rem] bg-white/10 backdrop-blur-xl border border-white/25 shadow-2xl logo-float-3d max-w-xs sm:max-w-sm w-full text-center">
              <div class="absolute -inset-1 rounded-[2.6rem] opacity-40 blur-xl -z-10" style="background: var(--iridescent-grad);"></div>
              <div id="hero-logo-showcase" class="w-44 h-44 sm:w-52 sm:h-52 mx-auto squircle-3d-logo overflow-hidden p-1.5 shadow-2xl">
                <!-- Populated with 49465.jpg -->
              </div>
              <div class="mt-5">
                <span class="inline-block px-3 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-widest bg-white/15 text-amber-300 border border-white/20">
                  SLTDA Approved Tours
                </span>
                <p class="text-xs text-slate-300 mt-2 font-medium">Private Chauffeurs • 24/7 Live Chat • Custom Packages</p>
              </div>
            </div>
          </div>

        </div>

        <!-- 3D Extruded Search & Region Filter Console -->
        <div class="mt-12 sm:mt-16 card-3d p-5 sm:p-6 text-slate-800 max-w-5xl mx-auto">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
            <div class="md:col-span-5">
              <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Search Sri Lanka Destination</label>
              <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-purple-600 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="public-search-input" oninput="filterDestinations()" placeholder="Sigiriya, Ella, Yala, Kandy, Mirissa..." class="w-full pl-10 pr-4 py-3 input-3d rounded-2xl text-sm font-medium">
              </div>
            </div>

            <div class="md:col-span-4">
              <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Tourism Region</label>
              <select id="public-category-filter" onchange="filterDestinations()" class="w-full px-4 py-3 input-3d rounded-2xl text-sm font-bold text-slate-700">
                <option value="All">All Sri Lanka Regions</option>
                <option value="Cultural Triangle">Cultural & Heritage</option>
                <option value="Hill Country">Hill Country & Tea Estates</option>
                <option value="Beaches & Coast">South Coast & Beaches</option>
                <option value="Wildlife & Nature">Wildlife & Safari Parks</option>
              </select>
            </div>

            <div class="md:col-span-3 flex items-end h-full">
              <button onclick="document.getElementById('destinations').scrollIntoView({behavior:'smooth'})" class="w-full btn-3d-dark font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 text-sm md:mt-5">
                <i data-lucide="map-pin" class="w-4 h-4 text-rose-400"></i>
                <span>Find 3D Tours</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Curated Sri Lanka Tourist Destinations Section -->
    <section id="destinations" class="py-16 sm:py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
      <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-5">
        <div>
          <span class="text-iridescent font-extrabold text-xs uppercase tracking-widest">Curated Sri Lanka Packages</span>
          <h2 class="font-display text-3xl sm:text-4xl font-extrabold text-slate-900 mt-1">Top Tourist Destinations</h2>
          <p class="text-slate-600 mt-2 max-w-2xl text-sm sm:text-base">Handpicked iconic destinations across Sri Lanka with licensed guides, luxury A/C vehicles, and instant online reservation.</p>
        </div>

        <!-- 3D Tactile Category Pills -->
        <div class="flex flex-wrap gap-2.5" id="category-pills">
          <button onclick="setCategoryPill('All')" data-cat="All" class="cat-pill active px-4 py-2 rounded-2xl text-xs font-extrabold btn-3d-iridescent">All</button>
          <button onclick="setCategoryPill('Cultural Triangle')" data-cat="Cultural Triangle" class="cat-pill px-4 py-2 rounded-2xl text-xs font-bold btn-3d-silver">Cultural</button>
          <button onclick="setCategoryPill('Hill Country')" data-cat="Hill Country" class="cat-pill px-4 py-2 rounded-2xl text-xs font-bold btn-3d-silver">Hill Country</button>
          <button onclick="setCategoryPill('Beaches & Coast')" data-cat="Beaches & Coast" class="cat-pill px-4 py-2 rounded-2xl text-xs font-bold btn-3d-silver">Beaches</button>
          <button onclick="setCategoryPill('Wildlife & Nature')" data-cat="Wildlife & Nature" class="cat-pill px-4 py-2 rounded-2xl text-xs font-bold btn-3d-silver">Wildlife</button>
        </div>
      </div>

      <!-- 3D Locations Grid -->
      <div id="destinations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Dynamically rendered 3D cards -->
      </div>
    </section>

    <!-- Why Travel With KETLO TRAVEL (Dark 3D Studio Section) -->
    <section id="experiences" class="bg-studio-950 text-white py-16 sm:py-24 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
      <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="max-w-7xl mx-auto relative z-10">
        <div class="text-center max-w-2xl mx-auto mb-14">
          <span class="text-amber-400 font-extrabold text-xs uppercase tracking-widest">Trusted Sri Lanka Tour Operat
